<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Admin Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .success {
            background-color: #d1fae5;
            border: 1px solid #10b981;
        }
        .error {
            background-color: #fee2e2;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>
    <h1>Admin Access Code Login Test</h1>
    
    <div class="form-group">
        <label for="apiUrl">Backend URL:</label>
        <input type="text" id="apiUrl" value="http://localhost:3000/api" />
    </div>
    
    <div class="form-group">
        <label for="accessCode">Access Code (12 characters):</label>
        <input type="text" id="accessCode" placeholder="ABC123DEF456" maxlength="12" />
    </div>
    
    <button onclick="testLogin()">Test Login</button>
    
    <div id="result"></div>
    
    <script>
        async function testLogin() {
            const apiUrl = document.getElementById('apiUrl').value;
            const accessCode = document.getElementById('accessCode').value;
            const resultDiv = document.getElementById('result');
            
            // Clear previous result
            resultDiv.innerHTML = '';
            resultDiv.className = 'result';
            
            // Validate input
            if (!accessCode || accessCode.length !== 12) {
                resultDiv.className = 'result error';
                resultDiv.textContent = 'Please enter a valid 12-character access code';
                return;
            }
            
            try {
                resultDiv.className = 'result';
                resultDiv.textContent = 'Testing connection to backend...';
                
                // First test: Check backend health
                try {
                    const healthResponse = await fetch(`${apiUrl.replace('/api', '')}/health`, {
                        method: 'GET',
                    });
                    
                    if (!healthResponse.ok) {
                        throw new Error(`Backend health check failed: ${healthResponse.status}`);
                    }
                    
                    resultDiv.textContent += '\n✓ Backend is running\n';
                } catch (healthError) {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `✗ Backend not accessible: ${healthError.message}\n\nMake sure the backend is running on http://localhost:3000`;
                    return;
                }
                
                // Second test: Login with access code
                resultDiv.textContent += 'Attempting login...';
                
                const response = await fetch(`${apiUrl}/auth/admin/access-code`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ accessCode }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✓ Login Successful!\n\n' + 
                        'Response:\n' + 
                        JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '✗ Login Failed\n\n' + 
                        'Status: ' + response.status + '\n' +
                        'Response:\n' + 
                        JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '✗ Error: ' + error.message + '\n\n' +
                    'This could mean:\n' +
                    '1. Backend is not running on http://localhost:3000\n' +
                    '2. CORS is blocking the request\n' +
                    '3. Network connection issue';
            }
        }
        
        // Allow Enter key to submit
        document.getElementById('accessCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                testLogin();
            }
        });
    </script>
</body>
</html>
