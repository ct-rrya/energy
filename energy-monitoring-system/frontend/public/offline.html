<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06120c" />
    <title>Offline · EcoStep</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #08150e;
        color: #eaf7ee;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 32px 24px;
        border-radius: 16px;
        background: #102118;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: rgba(25, 212, 106, 0.14);
        color: #19d46a;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 10px 0;
        font-size: 22px;
        line-height: 1.25;
      }
      p {
        margin: 0 0 22px 0;
        font-size: 14px;
        line-height: 1.6;
        color: #9bb3a5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 11px 22px;
        font-size: 14px;
        font-weight: 700;
        background: #19d46a;
        color: #091a10;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">EcoStep · Offline</span>
      <h1>You’re currently offline</h1>
      <p>
        EcoStep needs an internet connection to stream live footstep energy readings and community updates. Check your connection and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
