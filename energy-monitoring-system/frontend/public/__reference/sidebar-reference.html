<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EcoStep sidebar reference</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Registered so the browser can animate them; every size below derives from these. */
@property --rail-w  { syntax: "<length>"; inherits: true; initial-value: 80px; }
@property --notch-y { syntax: "<length>"; inherits: true; initial-value: 0px; }
@property --ix      { syntax: "<length>"; inherits: true; initial-value: 40px; }

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}

.shell{
  --ease:cubic-bezier(.65,0,.15,1);
  --green:#19d46a; --green-ink:#05361f;
  --shell:#070d1c; --bg:#0a1224; --ink:#eaf3ee; --mute:#93a39b;
  --rail:#16223f; --rail-ink:rgba(255,255,255,.72); --hover:rgba(255,255,255,.08);
  --rail-w:80px;            /* collapsed 80px, expanded 264px */
  --icon-x:40px;            /* center of every inactive icon */
  --notch-x:55px;           /* center of the green circle's round left end, and of the active icon */
  display:grid;grid-template-columns:var(--rail-w) 1fr;column-gap:16px;
  height:100vh;padding:16px;background:var(--shell);color:var(--ink);
}
.shell[data-theme="light"]{--shell:#ffffff;--bg:#f5f8f3;--ink:#0d1b14;--mute:#5b6b62;--rail:#101a30;--rail-ink:rgba(255,255,255,.72)}
.shell[data-expanded="true"]{--rail-w:264px}
.shell.ready{transition:--rail-w .45s var(--ease)}

.side{display:flex;flex-direction:column;gap:24px;min-height:0;min-width:0}

/* Logo badge: circle when collapsed, pill when expanded. Icon always at x = 40px. */
.badge{position:relative;flex:none;height:80px;width:var(--rail-w);border-radius:999px;background:var(--rail);color:var(--green);overflow:hidden}
.brand{position:absolute;left:76px;top:50%;translate:0 -50%;white-space:nowrap;opacity:0;color:#fff}
.brand b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--rail-ink)}
.badge .ico svg{stroke-width:1.75;width:26px;height:26px;opacity:1}
.badge .ico{width:26px;height:26px;translate:calc(var(--icon-x) - 13px) -50%}

/* Capsule: layers bottom to top = fill, ring (cut-out), blob (green), content */
.capsule{position:relative;flex:1;min-height:0;border-radius:44px;--notch-y:0px}
.shell.ready .capsule{transition:--notch-y .6s var(--ease)}
.fill{position:absolute;inset:0;border-radius:inherit;background:var(--rail)}
/* The cut-out is a shell-coloured shape painted over the rail. Outside the rail it is invisible. */
.ring{position:absolute;pointer-events:none;height:70px;top:calc(var(--notch-y) - 35px);
  left:20px;width:calc(var(--rail-w) - 10px);border-radius:999px;background:var(--shell)}
.blob{position:absolute;pointer-events:none;height:54px;top:calc(var(--notch-y) - 27px);
  left:28px;width:calc(var(--rail-w) - 26px);border-radius:999px;background:var(--green)}

.content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:16px 0}
.sep{flex:none;height:1px;margin:0 16px 12px;background:rgba(255,255,255,.08)}
.grow{flex:1}

.row{position:relative;flex:none;display:block;width:100%;height:56px;margin:0 0 12px;padding:0;border:0;background:none;
  font:inherit;text-align:left;text-decoration:none;color:var(--rail-ink);cursor:pointer;
  --ix:var(--icon-x)}
.shell.ready .row{transition:--ix .6s var(--ease),color .3s}
.row[aria-current="page"]{--ix:var(--notch-x);color:var(--green-ink)}
.row::before{content:"";position:absolute;inset:6px 8px;border-radius:999px;background:var(--hover);opacity:0;transition:opacity .2s}
.row:hover::before{opacity:1}
.row[aria-current="page"]::before{display:none}
.row:focus-visible{outline:3px solid var(--green);outline-offset:-3px;border-radius:999px}

/* ONE element carries position (translate). Hover effects live on the inner svg (scale/opacity). */
.ico{position:absolute;left:0;top:50%;width:22px;height:22px;translate:calc(var(--ix) - 11px) -50%}
.ico svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.72;transition:scale .2s,opacity .2s}
.row:hover .ico svg{scale:1.08;opacity:1}
.row[aria-current="page"] .ico svg{opacity:1}

.label{position:absolute;top:50%;left:calc(var(--ix) + 24px);translate:0 -50%;white-space:nowrap;font-size:15px;font-weight:600;opacity:0;pointer-events:none}
.row[aria-current="page"] .label{font-weight:800}
.who .label small{display:block;font-size:12px;font-weight:400;opacity:.8}
.avatar{position:absolute;left:18px;top:6px;width:44px;height:44px;border-radius:50%;background:var(--hover)}
.avatar .ico{left:11px;top:11px;translate:none}

.shell[data-expanded="true"] .label,
.shell[data-expanded="true"] .brand{opacity:1;transition:opacity .2s .15s}
.shell:not([data-expanded="true"]) .label,
.shell:not([data-expanded="true"]) .brand{transition:opacity .1s}

.main{background:var(--bg);border-radius:36px;padding:32px;overflow:auto;min-width:0}
.main h1{margin:0 0 8px;font-size:40px;letter-spacing:-.03em}
.main p{color:var(--mute)}

@media (prefers-reduced-motion:reduce){.shell,.capsule,.row{transition:none!important}}
</style>
</head>
<body>
<div class="shell" data-theme="dark" data-expanded="false" id="shell">
  <aside class="side">
    <a class="badge" href="#" aria-label="EcoStep home">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg></span>
      <span class="brand"><b>EcoStep</b><small>Energy monitoring</small></span>
    </a>

    <nav class="capsule" id="capsule" aria-label="Main">
      <div class="fill"></div>
      <div class="ring"></div>
      <div class="blob"></div>
      <div class="content">
        <button class="row" id="toggle" aria-expanded="false" aria-label="Toggle sidebar">
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span><span class="label">Collapse</span>
        </button>
        <div class="sep"></div>
        <a class="row" href="#home" data-route><span class="ico"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="label">Home</span></a>
        <a class="row" href="#central" data-route aria-current="page"><span class="ico"><svg viewBox="0 0 24 24"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg></span><span class="label">EcoStep Central</span></a>
        <a class="row" href="#analytics" data-route><span class="ico"><svg viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span><span class="label">Historical Analytics</span></a>
        <div class="grow"></div>
        <div class="sep"></div>
        <button class="row" id="theme" aria-label="Toggle theme"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span><span class="label">Theme</span></button>
        <div class="row who" style="margin-bottom:0;cursor:default"><span class="avatar"><span class="ico"><svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span></span><span class="label">Guest<small>Read-only access</small></span></div>
      </div>
    </nav>
  </aside>
  <main class="main"><h1 id="title">EcoStep Central</h1><p>Reference page content.</p></main>
</div>

<script>
(function(){
  var shell=document.getElementById('shell'),cap=document.getElementById('capsule');
  var rows=[].slice.call(document.querySelectorAll('.row[data-route]'));
  function place(){
    var a=document.querySelector('.row[aria-current="page"]');
    cap.style.setProperty('--notch-y',(a.offsetTop+a.offsetHeight/2)+'px');
  }
  rows.forEach(function(r){r.addEventListener('click',function(e){
    e.preventDefault();rows.forEach(function(x){x.removeAttribute('aria-current')});
    r.setAttribute('aria-current','page');place();
    document.getElementById('title').textContent=r.querySelector('.label').textContent;
  })});
  document.getElementById('toggle').addEventListener('click',function(){
    var on=shell.dataset.expanded!=='true';shell.dataset.expanded=on;this.setAttribute('aria-expanded',on);
  });
  document.getElementById('theme').addEventListener('click',function(){
    shell.dataset.theme=shell.dataset.theme==='dark'?'light':'dark';
  });
  place();requestAnimationFrame(function(){requestAnimationFrame(function(){shell.classList.add('ready')})});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);
  addEventListener('resize',place);
})();
</script>
</body>
</html>
